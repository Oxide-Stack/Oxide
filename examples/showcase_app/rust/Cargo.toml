[package]
name = "rust_lib_showcase_app"
version = "0.4.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
image = "0.25.10"
oxide_core = {  path = "../../../rust/oxide_core" }
oxide_generator_rs = {path = "../../../rust/oxide_generator_rs" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
tokio-stream = { version = "0.1", features = ["sync"] }


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.34.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
tokio = { version = "1.34.0", features = ["rt", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "wasi"))'.dependencies]
tokio = { version = "1.34.0", features = ["rt", "sync", "time"] }

[features]
default = ["navigation-binding", "isolated-channels", "state-persistence"]
navigation-binding = ["oxide_core/navigation-binding", "oxide_generator_rs/navigation-binding"]
isolated-channels = ["oxide_core/isolated-channels", "oxide_generator_rs/isolated-channels"]
state-persistence = ["oxide_core/state-persistence", "oxide_generator_rs/state-persistence"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
