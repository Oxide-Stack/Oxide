name: Basic CI

on:
  push:
    branches-ignore:
      - main
    tags-ignore:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: basic-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FLUTTER_ROOT: ""

jobs:
  basic-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Flutter pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Prepare toolchains
        shell: bash
        run: |
          set -euo pipefail
          bash ./tools/scripts/qa/00-verify-versions.sh
          # Linux runner: skip windows desktop toggle, ensure FRB + wasm prerequisites
          bash ./tools/scripts/qa/10-setup-toolchains.sh 0 1 1

      - name: Run minimal repository test suite
        env:
          QA_SKIP_COVERAGE: "1"
        shell: bash
        run: |
          set -euo pipefail
          bash ./tools/scripts/qa/20-rust.sh 1
          bash ./tools/scripts/qa/30-flutter-packages.sh 1
