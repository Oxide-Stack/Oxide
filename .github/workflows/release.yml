name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). If empty, uses the ref tag."
        required: false
        type: string
      dry_run:
        description: "Dry run mode - validate and test but skip publishing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FLUTTER_ROOT: ""

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate tag matches VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION | tr -d '\r\n' | xargs)"
          if [[ -z "$VERSION" ]]; then
            echo "VERSION is empty" >&2
            exit 1
          fi

          TAG_INPUT="${{ inputs.tag }}"
          if [[ -n "$TAG_INPUT" ]]; then
            TAG="$TAG_INPUT"
            REF="refs/tags/$TAG"
          else
            if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
              echo "workflow_dispatch requires inputs.tag (e.g. v0.1.0) when not running on a tag ref" >&2
              exit 1
            fi
            TAG="${GITHUB_REF_NAME}"
            REF="${GITHUB_REF}"
          fi

          if [[ "$TAG" != v* ]]; then
            echo "Tag must start with 'v' (got '$TAG')" >&2
            exit 1
          fi

          TAG_VERSION="${TAG#v}"
          if [[ "$TAG_VERSION" != "$VERSION" ]]; then
            echo "Tag version '$TAG_VERSION' does not match VERSION '$VERSION'" >&2
            exit 1
          fi

          DRY_RUN="${{ inputs.dry_run }}"
          if [[ -z "$DRY_RUN" ]]; then
            DRY_RUN="false"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "Validated version: $VERSION (ref: $REF, dry_run: $DRY_RUN)"

      - name: Verify version sync
        shell: bash
        run: |
          set -euo pipefail
          bash ./tools/scripts/version_sync.sh --verify

  final-check-linux:
    runs-on: ubuntu-latest
    needs: [validate]
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.ref }}
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Flutter pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Final QA check (Linux)
        env:
          QA_EXAMPLE_MAX_PARALLEL: "2"
        shell: bash
        run: |
          set -euo pipefail
          bash ./tools/scripts/qa/qa.sh

  final-check-windows:
    runs-on: windows-latest
    needs: [validate]
    timeout-minutes: 240
    steps:
      - name: Configure git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.ref }}
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            rust/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Flutter pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Final QA check (Windows)
        env:
          QA_EXAMPLE_MAX_PARALLEL: "2"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\tools\scripts\qa.ps1 -ExampleMaxParallel 2

  publish-rust:
    runs-on: ubuntu-latest
    needs: [validate, final-check-linux, final-check-windows]
    if: needs.validate.outputs.dry_run != 'true'
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.ref }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Require crates.io token
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN}" ]]; then
            echo "CARGO_REGISTRY_TOKEN is required for release publishing." >&2
            exit 1
          fi

      - name: Publish oxide_core
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          output=""
          if output="$(cargo publish -p oxide_core 2>&1)"; then
            printf '%s\n' "$output"
          else
            exit_code="$?"
            printf '%s\n' "$output"
            if printf '%s\n' "$output" | grep -qiE '(already (uploaded|exists)|is already uploaded|previously published)'; then
              echo "oxide_core@$VERSION is already published; skipping."
              exit 0
            fi
            exit "$exit_code"
          fi

      - name: Publish oxide_generator_rs
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          # Wait for crates.io to index the previous crate
          sleep 30
          output=""
          if output="$(cargo publish -p oxide_generator_rs 2>&1)"; then
            printf '%s\n' "$output"
          else
            exit_code="$?"
            printf '%s\n' "$output"
            if printf '%s\n' "$output" | grep -qiE '(already (uploaded|exists)|is already uploaded|previously published)'; then
              echo "oxide_generator_rs@$VERSION is already published; skipping."
              exit 0
            fi
            exit "$exit_code"
          fi

  publish-flutter:
    runs-on: ubuntu-latest
    needs: [validate, final-check-linux, final-check-windows]
    if: needs.validate.outputs.dry_run != 'true'
    environment: pub.dev
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.ref }}

      - name: Setup Dart (OIDC for pub.dev)
        uses: dart-lang/setup-dart@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install flutter_rust_bridge_codegen
        shell: bash
        run: |
          set -euo pipefail
          # Install via cargo (preferred). Ensure cargo's bin dir is on PATH for subsequent steps.
          cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked || true
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Publish oxide_annotations
        working-directory: flutter/oxide_annotations
        shell: bash
        run: |
          set -uo pipefail
          log="$(mktemp)"
          dart pub publish --force 2>&1 | tee "$log"
          exit_code="${PIPESTATUS[0]}"
          if [[ "$exit_code" -ne 0 ]]; then
            if grep -qiE '(already (published|exists)|already has version|version.*already)' "$log"; then
              echo "oxide_annotations@$VERSION is already published; skipping."
              exit 0
            fi
            exit "$exit_code"
          fi

      - name: Publish oxide_generator
        working-directory: flutter/oxide_generator
        shell: bash
        run: |
          set -uo pipefail
          # Wait for pub.dev to index the previous package
          sleep 30
          log="$(mktemp)"
          dart pub publish --force 2>&1 | tee "$log"
          exit_code="${PIPESTATUS[0]}"
          if [[ "$exit_code" -ne 0 ]]; then
            if grep -qiE '(already (published|exists)|already has version|version.*already)' "$log"; then
              echo "oxide_generator@$VERSION is already published; skipping."
              exit 0
            fi
            exit "$exit_code"
          fi

      - name: Publish oxide_runtime
        working-directory: flutter/oxide_runtime
        shell: bash
        run: |
          set -uo pipefail
          # Wait for pub.dev to index the previous package
          sleep 30
          log="$(mktemp)"
          dart pub publish --force 2>&1 | tee "$log"
          exit_code="${PIPESTATUS[0]}"
          if [[ "$exit_code" -ne 0 ]]; then
            if grep -qiE '(already (published|exists)|already has version|version.*already)' "$log"; then
              echo "oxide_runtime@$VERSION is already published; skipping."
              exit 0
            fi
            exit "$exit_code"
          fi

  # Summary job for release status
  release-complete:
    runs-on: ubuntu-latest
    needs: [validate, final-check-linux, final-check-windows, publish-rust, publish-flutter]
    if: always()
    steps:
      - name: Check release results
        run: |
          echo "Release pipeline summary:"
          echo "  - Validation: ${{ needs.validate.result }}"
          echo "  - Linux QA: ${{ needs.final-check-linux.result }}"
          echo "  - Windows QA: ${{ needs.final-check-windows.result }}"
          echo "  - Rust publish: ${{ needs.publish-rust.result }}"
          echo "  - Flutter publish: ${{ needs.publish-flutter.result }}"

          if [[ "${{ needs.validate.result }}" != "success" ]]; then
            echo "Validation failed"
            exit 1
          fi
          if [[ "${{ needs.final-check-linux.result }}" != "success" ]]; then
            echo "Linux QA failed"
            exit 1
          fi
          if [[ "${{ needs.final-check-windows.result }}" != "success" ]]; then
            echo "Windows QA failed"
            exit 1
          fi

          # Publish jobs may be skipped in dry_run mode
          if [[ "${{ needs.publish-rust.result }}" == "failure" ]]; then
            echo "Rust publish failed"
            exit 1
          fi
          if [[ "${{ needs.publish-flutter.result }}" == "failure" ]]; then
            echo "Flutter publish failed"
            exit 1
          fi

          echo "Release completed successfully!"
