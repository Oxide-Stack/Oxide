name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). If empty, uses the ref tag."
        required: false
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: version
        name: Validate tag matches VERSION
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION | tr -d '\r\n' | xargs)"
          if [[ -z "$VERSION" ]]; then
            echo "VERSION is empty" >&2
            exit 1
          fi

          TAG_INPUT="${{ inputs.tag }}"
          if [[ -n "$TAG_INPUT" ]]; then
            TAG="$TAG_INPUT"
            REF="refs/tags/$TAG"
          else
            if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
              echo "workflow_dispatch requires inputs.tag (e.g. v0.1.0) when not running on a tag ref" >&2
              exit 1
            fi
            TAG="${GITHUB_REF_NAME}"
            REF="${GITHUB_REF}"
          fi

          if [[ "$TAG" != v* ]]; then
            echo "Tag must start with 'v' (got '$TAG')" >&2
            exit 1
          fi

          TAG_VERSION="${TAG#v}"
          if [[ "$TAG_VERSION" != "$VERSION" ]]; then
            echo "Tag version '$TAG_VERSION' does not match VERSION '$VERSION'" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Verify version sync
        shell: bash
        run: |
          set -euo pipefail
          bash ./tools/scripts/version_sync.sh --verify

  test-ubuntu:
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install flutter_rust_bridge_codegen
        shell: bash
        run: |
          set -euo pipefail
          # Install via cargo (preferred). Ensure cargo's bin dir is on PATH for subsequent steps.
          cargo install flutter_rust_bridge_codegen || true
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Test (Rust workspace)
        working-directory: rust
        run: cargo test --workspace
      - name: Test (Example Rust crates)
        shell: bash
        run: |
          set -euo pipefail
          examples=(
            "examples/counter_app/rust"
            "examples/todos_app/rust"
            "examples/ticker_app/rust"
            "examples/benchmark_app/rust"
          )
          for dir in "${examples[@]}"; do
            example_root="$(dirname "$dir")"
            (
              cd "$example_root"
              flutter pub get
              flutter_rust_bridge_codegen generate --config-file flutter_rust_bridge.yaml
              cd "rust"
              cargo test
            )
          done
      - name: Test oxide_runtime
        working-directory: flutter/oxide_runtime
        run: flutter test
      - name: Test oxide_generator
        working-directory: flutter/oxide_generator
        run: dart test
      - name: Analyze oxide_annotations
        working-directory: flutter/oxide_annotations
        run: dart analyze
      - name: Test examples (Flutter tests)
        shell: bash
        run: |
          set -euo pipefail
          examples=(
            "examples/counter_app"
            "examples/todos_app"
            "examples/ticker_app"
            "examples/benchmark_app"
            "examples/api_browser_app"
          )
          for dir in "${examples[@]}"; do
            (
              cd "$dir"
              flutter pub get
              # Use cargo-installed tool
              if command -v flutter_rust_bridge_codegen >/dev/null 2>&1; then
                flutter_rust_bridge_codegen generate --config-file flutter_rust_bridge.yaml
              else
                echo "flutter_rust_bridge_codegen not found; make sure cargo installed it" >&2
                exit 1
              fi
              if git diff --name-only | grep -E '(^|/)frb_generated\.' >/dev/null; then
                echo "FRB generated outputs are out of date in $dir:"
                git diff --name-only | grep -E '(^|/)frb_generated\.'
                exit 1
              fi
              dart run build_runner build -d
              flutter test
            )
          done

  test-windows:
    runs-on: windows-latest
    needs: [validate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop and list devices
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          flutter config --enable-windows-desktop
          flutter doctor -v
          flutter devices
      - name: Install flutter_rust_bridge_codegen
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          # Install via cargo on Windows. Ensure cargo's bin dir is available to subsequent steps in this job step.
          try {
            # If the binary is already available this will succeed quickly
            flutter_rust_bridge_codegen --version | Out-Null
          } catch {
            & cargo install flutter_rust_bridge_codegen -q || true
          }
          # Add cargo bin to PATH for the remainder of this step (and subsequent steps in the job).
          $env:PATH = "$env:PATH;$env:USERPROFILE\.cargo\bin"
      - name: Test examples (Windows integration tests)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          function Invoke-Native {
            param(
              [Parameter(Mandatory = $true)][string]$Command,
              [Parameter(Mandatory = $true)][string[]]$Args
            )
            & $Command @Args
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) {
              throw "Command failed ($exitCode): $Command $($Args -join ' ')"
            }
          }
          $exampleDirs = @(
            "examples\counter_app",
            "examples\todos_app",
            "examples\ticker_app",
            "examples\benchmark_app",
            "examples\api_browser_app"
          )
          foreach ($dir in $exampleDirs) {
            Push-Location $dir
            try {
              Invoke-Native -Command flutter -Args @("pub", "get")
              if (Test-Path "flutter_rust_bridge.yaml") {
                Invoke-Native -Command flutter_rust_bridge_codegen -Args @("generate", "--config-file", "flutter_rust_bridge.yaml")
                $diff = git diff --name-only | Select-String -Pattern '(^|/)frb_generated\.'
                if ($diff) {
                  Write-Host "FRB generated outputs are out of date in ${dir}:"
                  $diff | ForEach-Object { Write-Host $_ }
                  throw "FRB generated outputs are out of date."
                }
              }
              if (Test-Path "rust") {
                Push-Location "rust"
                try {
                  Invoke-Native -Command cargo -Args @("build")
                } finally {
                  Pop-Location
                }
              }
              Invoke-Native -Command dart -Args @("run", "build_runner", "build", "-d")
              Invoke-Native -Command flutter -Args @("test")
              if (Test-Path "integration_test") {
                $tests = Get-ChildItem -Path "integration_test" -Filter "*_test.dart" -File
                foreach ($test in $tests) {
                  Invoke-Native -Command flutter -Args @("test", "-d", "windows", $test.FullName)
                }
              }
            } finally {
              Pop-Location
            }
          }

  publish-rust:
    runs-on: ubuntu-latest
    needs: [validate, test-ubuntu, test-windows]
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish oxide_core
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          output=""
          if ! output="$(cargo publish -p oxide_core 2>&1)"; then
            exit_code="$?"
            printf '%s\n' "$output"
            if printf '%s\n' "$output" | grep -qiE '(already (uploaded|exists)|is already uploaded|previously published)'; then
              echo "oxide_core@$VERSION is already published; skipping."
              exit 0
            fi
            exit "$exit_code"
          fi
          printf '%s\n' "$output"
      - name: Publish oxide_generator_rs
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          output=""
          if ! output="$(cargo publish -p oxide_generator_rs 2>&1)"; then
            exit_code="$?"
            printf '%s\n' "$output"
            if printf '%s\n' "$output" | grep -qiE '(already (uploaded|exists)|is already uploaded|previously published)'; then
              echo "oxide_generator_rs@$VERSION is already published; skipping."
              exit 0
            fi
            exit "$exit_code"
          fi
          printf '%s\n' "$output"

  publish-flutter:
    runs-on: ubuntu-latest
    needs: [validate, test-ubuntu, test-windows]
    environment: pub.dev
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.ref }}
      - name: Setup Dart (OIDC for pub.dev)
        uses: dart-lang/setup-dart@v1
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install flutter_rust_bridge_codegen
        shell: bash
        run: |
          set -euo pipefail
          # Install via cargo (preferred). Ensure cargo's bin dir is on PATH for subsequent steps.
          cargo install flutter_rust_bridge_codegen || true
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Publish oxide_annotations
        working-directory: flutter/oxide_annotations
        shell: bash
        run: |
          set -uo pipefail
          log="$(mktemp)"
          dart pub publish --force 2>&1 | tee "$log"
          exit_code="${PIPESTATUS[0]}"
          if [[ "$exit_code" -ne 0 ]]; then
            if grep -qiE '(already (published|exists)|already has version|version.*already)' "$log"; then
              echo "oxide_annotations@$VERSION is already published; skipping."
              exit 0
            fi
            exit "$exit_code"
          fi

      - name: Publish oxide_generator
        working-directory: flutter/oxide_generator
        shell: bash
        run: |
          set -uo pipefail
          log="$(mktemp)"
          dart pub publish --force 2>&1 | tee "$log"
          exit_code="${PIPESTATUS[0]}"
          if [[ "$exit_code" -ne 0 ]]; then
            if grep -qiE '(already (published|exists)|already has version|version.*already)' "$log"; then
              echo "oxide_generator@$VERSION is already published; skipping."
              exit 0
            fi
            exit "$exit_code"
          fi

      - name: Publish oxide_runtime
        working-directory: flutter/oxide_runtime
        shell: bash
        run: |
          set -uo pipefail
          log="$(mktemp)"
          dart pub publish --force 2>&1 | tee "$log"
          exit_code="${PIPESTATUS[0]}"
          if [[ "$exit_code" -ne 0 ]]; then
            if grep -qiE '(already (published|exists)|already has version|version.*already)' "$log"; then
              echo "oxide_runtime@$VERSION is already published; skipping."
              exit 0
            fi
            exit "$exit_code"
          fi
