name: Test Suite

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: test-suite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FLUTTER_ROOT: ""

jobs:
  pr-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Validate PR source branch
        id: check
        run: |
          if [[ "${{ github.event.pull_request.head.ref }}" == "develop" ]]; then
            echo "Running full test suite for PR from develop into main."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping full test suite for non-develop branch."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  full-qa-linux:
    needs: pr-gate
    # Use always() so GitHub evaluates this job even if pr-gate skipped or changed behavior
    if: always() && needs.pr-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Flutter pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Run full QA on Linux
        env:
          QA_EXAMPLE_MAX_PARALLEL: "2"
        shell: bash
        run: |
          set -euo pipefail
          bash ./tools/scripts/qa/qa.sh

  full-qa-windows:
    needs: pr-gate
    if: always() && needs.pr-gate.outputs.should_run == 'true'
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - name: Configure git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Flutter pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Run full QA on Windows
        env:
          QA_EXAMPLE_MAX_PARALLEL: "2"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\tools\scripts\qa.ps1 -ExampleMaxParallel 2

  test-suite-complete:
    runs-on: ubuntu-latest
    needs: [pr-gate, full-qa-linux, full-qa-windows]
    if: always()
    steps:
      - name: Check test results
        run: |

          if [[ "${{ needs.pr-gate.outputs.should_run }}" != "true" ]]; then
            echo "PR is not from develop branch - test suite bypassed cleanly."
            exit 0
          fi


          if [[ "${{ needs.full-qa-linux.result }}" != "success" ]] || [[ "${{ needs.full-qa-windows.result }}" != "success" ]]; then
            echo "One or more QA jobs failed."
            exit 1
          fi
          echo "All QA jobs passed successfully."
