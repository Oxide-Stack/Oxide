name: Test Suite

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: test-suite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FLUTTER_ROOT: ""

jobs:
  rust-crate-tests:
    name: Rust QA (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        crate:
          - oxide_core
          - oxide_generator_rs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build (Linux)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Cargo registry and build (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            rust\target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify versions
        run: bash ./tools/scripts/qa/00-verify-versions.sh

      - name: Setup Rust toolchains
        run: bash ./tools/scripts/qa/10-setup-toolchains.sh 0 0 1

      - name: Run Rust QA
        run: bash ./tools/scripts/qa/20-rust.sh 0 --crate ${{ matrix.crate }}

  flutter-package-tests:
    name: Flutter package QA (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        package:
          - oxide_runtime
          - oxide_generator
          - oxide_annotations
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Flutter pub dependencies (Linux)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Flutter pub dependencies (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Verify versions
        run: bash ./tools/scripts/qa/00-verify-versions.sh

      - name: Setup toolchains
        run: bash ./tools/scripts/qa/10-setup-toolchains.sh 1 1 0

      - name: Run Flutter package QA
        run: bash ./tools/scripts/qa/30-flutter-packages.sh 0 --package ${{ matrix.package }}

  examples-tests:
    name: Examples QA (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux
          - os: windows-latest
            os_name: windows
    steps:
      - name: Configure git line endings
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Flutter pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Verify versions (Linux)
        if: runner.os != 'Windows'
        run: bash ./tools/scripts/qa/00-verify-versions.sh

      - name: Setup toolchains (Linux)
        if: runner.os != 'Windows'
        run: bash ./tools/scripts/qa/10-setup-toolchains.sh 1 1 1

      - name: Run examples QA (Linux)
        if: runner.os != 'Windows'
        run: bash ./tools/scripts/qa/50-examples.sh --max-parallel 2

      - name: Verify versions (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\tools\scripts\qa\00-verify-versions.ps1

      - name: Setup toolchains (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\tools\scripts\qa\10-setup-toolchains.ps1 -EnableWindowsDesktop -EnsureFrbCodegen -EnsureRustWasmTargets

      - name: Run examples QA (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\tools\scripts\qa\50-examples.ps1 -MaxParallel 2
