name: {{app_name}}
description: "A new Oxide + flutter_rust_bridge app."
publish_to: "none"
version: 0.5.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  {{rust_crate}}:
    path: rust_builder
  flutter_rust_bridge: 2.12.0
  freezed_annotation: ^3.0.0
{{oxide_runtime_dep}}{{backend_deps}}
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  build_runner: ^2.4.13
  freezed: ^3.0.0
{{oxide_generator_dep}}
flutter:
  uses-material-design: true
