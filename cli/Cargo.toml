[package]
name = "oxide-cli"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "Oxide developer CLI: create, integrate, generate, doctor for Flutter+Rust (FRB) apps."
license = "MIT OR Apache-2.0"
publish = false

# Library target so `tests/` can exercise the same code the binary runs, rather
# than re-including individual source files with `#[path]`.
[lib]
name = "oxide_cli"
path = "src/lib.rs"

[[bin]]
name = "oxide"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml_edit = "0.22"
yaml-edit = "0.3"
which = "6"
walkdir = "2"
semver = "1"
regex = "1"
include_dir = "0.7"
console = "0.15"
similar = "2"
chrono = "0.4"
notify = "6"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
insta = "1"
